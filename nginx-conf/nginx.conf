# /etc/nginx/conf.d/nginx.conf

# Define an upstream server block for the MCP application.
# NGINX will use ECS Service Discovery to resolve the 'mcp-app' hostname
# to the private IP addresses of your application tasks.
upstream mcp_app_service {
    # The service discovery name for your MCP application service.
    # The A records for this name will be the IPs of the tasks.
    server mcp-app.local:8080;
}

server {
    listen 80;
    server_name _;

    # Increase timeouts for long-lived MCP connections (e.g., SSE).
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
    keepalive_timeout 24h;

    location / {
        # Forward requests to the mcp_app_service upstream.
        proxy_pass http://mcp_app_service;

        # Set headers to pass necessary information to the application.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Essential for WebSocket and SSE (long-lived connections).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Disable buffering to allow for streaming responses like SSE.
        proxy_buffering off;
    }
}
