name: client

on:
  push:
    paths:
      - 'client/**'
    branches:
      - main

concurrency:
  group: client
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Npm Install
        run: |
          cd client/
          npm ci
      
      - name: Check Formatting
        run: |
          cd client/
          make fmt_check
